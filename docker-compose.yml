services:
  jekyll:
    image: jekyll/jekyll:latest
    # The upstream image runs under amd64 emulation on Apple Silicon and other ARM hosts.
    platform: linux/amd64
    command: jekyll serve --watch --force_polling --verbose
    ports:
      - 4000:4000
    volumes:
      - .:/srv/jekyll
      - bundle_volume:/usr/local/bundle

volumes:
  bundle_volume:
