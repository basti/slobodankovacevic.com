about:
  - >
    I'm a CTO and Head of Software Engineering with over two decades of experience
    in web application development. I specialize in designing and implementing custom
    software solutions using open source technologies.
  - >
    Currently I lead engineering teams of 50+ developers at
    <a href="https://axiomq.com">AxiomQ</a>, where I define technology strategy,
    architect technical solutions, and build project teams from the ground up.
    Before that I built and grew Orange Iceberg, a Ruby development company.
  - >
    I've been building for the web since 1998 — from hands-on coding to leading
    cross-functional teams that deliver scalable, high-performance applications.

contact: >
  I'm always interested in hearing about new projects, technical challenges, or opportunities
  to collaborate. Based in Novi Sad, Serbia — get in touch through
  <a href="https://axiomq.com/contact/">AxiomQ</a> or find me on
  <a href="https://www.linkedin.com/in/slobodankovacevic">LinkedIn</a>.

resume:
  - company: AxiomQ
    position: CTO / Head of Software Engineering
    description: Merged two companies to create <a href="https://axiomq.com">AxiomQ</a>. Led the development of multiple web-based applications using open source technologies. Built and mentored engineering teams across the company, defined technology strategy, and implemented agile methodologies to deliver projects on time and within budget.
    start_year: 2017
    end_year: Present
    start_month: May
    end_month: Present
  - company: Orange Iceberg
    position: Project manager/Lead developer
    description: Grew <a href="http://orangeiceberg.com">Orange Iceberg</a> into a Ruby development company with a team of skilled developers. Implemented best practices for Ruby development and code standards, managed multiple projects from conception to delivery, and provided technical mentorship to team members.
    start_year: 2014
    end_year: 2017
    start_month: Jan
    end_month: May
  - company: Earth.org GmbH
    position: Ruby developer
    description: Maintained and updated yoga.info. Designed a JSON service-based architecture with a shared API and admin section to power both yoga.info and ayurvedafinder.com.
    start_year: 2012
    end_year: 2014
    start_month: June
    end_month: Jan
  - company: Reciprocity Inc.
    position: Ruby developer
    description: Senior Engineer (Ruby on Rails) on the <a href="http://www.reciprocitynow.com/">Reciprocity gamification app</a>, opower.com, sonatype.com, and Google's GRC project.
